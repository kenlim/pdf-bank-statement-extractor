# Extractor for HSBC Advance statements (UK).
#
# HSBC statements use SEPARATE debit/credit columns (£Paid out / £Paid in /
# £Balance) with no grid lines, and descriptions that span multiple lines. This
# needs the "positional" mode: words are classified into columns by their
# x-position, descriptions accumulate across lines, and a transaction is emitted
# whenever a row carries a paid-out or paid-in amount. The signed amount is
# paid_in - paid_out, so credits are positive and debits negative.

name: hsbc-advance

match:
  - "HBUKGB"           # Bank Identifier Code prefix, unique to HSBC UK
  - "Your HSBC Advance"

normalization:
  date_formats:
    - "%d %b %y"       # 29 Aug 26
  decimal_separator: "."
  thousands_separator: ","

fields:
  statement_period:
    pattern: "^(\\d{2} \\w+ to \\d{2} \\w+ \\d{4})$"
  opening_balance:
    pattern: "OpeningBalance\\s*£([\\d,]+\\.\\d{2})"
    kind: amount
  closing_balance:
    pattern: "ClosingBalance\\s*£([\\d,]+\\.\\d{2})"
    kind: amount

transactions:
  mode: positional
  # Column footprints in PDF x-coordinates (points). Text columns match where a
  # word STARTS (left edge); amount columns match where a number ENDS (right
  # edge). Amount columns are tested in order (paid_out, paid_in, balance), so a
  # number ending at/before 410 is paid_out even though it also satisfies
  # paid_in's bound.
  column_bounds:
    date:     { starts_before: 100 }  # date words start at/before x0=100 ("29 Aug 26")
    paid_out: { ends_before: 410 }    # number ends at/before x1=410 -> debit
    paid_in:  { ends_before: 495 }    # else ends at/before x1=495   -> credit
    balance:  { ends_after: 495 }     # else ends at/after  x1=495   -> balance
  # A date cell looks like "29 Aug 26".
  date_pattern: "^\\d{2} \\w{3} \\d{2}$"
  amount_pattern: "^[\\d,]+\\.\\d{2}$"
  # Brought/carried forward rows are balance markers, not transactions.
  skip_rows_matching:
    - "BALANCE *BROUGHT *FORWARD"
    - "BALANCE *CARRIED *FORWARD"
